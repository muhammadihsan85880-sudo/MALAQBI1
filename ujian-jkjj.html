<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jkjj</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:#f3f6f4; margin:0; color:#1b2a22;}
  .wrap{max-width:720px; margin:0 auto; padding:18px 16px 90px;}
  .card{background:#fff; border:1.5px solid #dce7e0; border-radius:14px; padding:18px; margin-bottom:14px;}
  h1{font-size:19px; margin:0 0 4px;}
  .muted{color:#6b8577; font-size:12.5px;}
  label{display:block; font-size:12.5px; font-weight:700; margin-bottom:5px;}
  input[type=text]{width:100%; padding:9px 10px; border:1.5px solid #cfe3d6; border-radius:9px; font-size:14px; margin-bottom:12px;}
  .btn{display:inline-block; border:none; border-radius:9px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer;}
  .btn-primary{background:#1f7a4d; color:#fff; width:100%;}
  .soal{margin-bottom:16px;}
  .soal b{display:block; margin-bottom:8px; font-size:14.5px;}
  .opsi{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1.5px solid #e3ede7; border-radius:9px; margin-bottom:6px; cursor:pointer;}
  .opsi:hover{border-color:#8fd8ac;}
  .opsi input{margin-top:3px;}
  #timer{position:sticky; top:0; background:#163c29; color:#fff; text-align:center; padding:9px; font-weight:700; border-radius:0 0 10px 10px; z-index:9;}
  #hasilBox{text-align:center;}
  #hasilBox .skor{font-size:40px; font-weight:800; color:#1f7a4d;}
  .err{color:#b3364f; font-size:12.5px; margin-top:8px;}
  .hint{color:#6b8577; font-size:12px; margin:-2px 0 8px;}
  .jrow{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
  .jrow .jk{flex:1; font-size:14px;}
  .jrow select{flex:1; padding:8px; border:1.5px solid #cfe3d6; border-radius:9px; font-size:13.5px; background:#fff; min-width:0;}
  .soal input.isian, .soal textarea{width:100%; padding:9px 10px; border:1.5px solid #cfe3d6; border-radius:9px; font-size:14px; font-family:inherit;}
  .soal textarea{min-height:110px; resize:vertical;}
  #banner{display:none; background:#fff7e0; border:1.5px solid #ecd9a0; color:#6b5313; font-size:12.5px; padding:8px 12px; border-radius:10px; margin:10px 0;}
  #banner.bad{background:#fde8ec; border-color:#f0b7c3; color:#b3364f; font-weight:700;}
  #peringatan{display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(22,60,41,.9); z-index:99; align-items:center; justify-content:center; padding:20px;}
  #peringatan .pbox{background:#fff; border-radius:16px; padding:22px; max-width:380px; text-align:center;}
  #peringatan h2{margin:6px 0 8px; color:#b3364f; font-size:20px;}
  #peringatan p{font-size:13.5px; line-height:1.5; margin:0 0 14px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="identitasPane" class="card">
    <h1 id="judulTes"></h1>
    <p class="muted" id="infoTes"></p>
    <label>Nama Lengkap</label><input type="text" id="inNama" placeholder="Nama lengkap">
    <label>NIS</label><input type="text" id="inNis" placeholder="NIS">
    <label>Kelas</label><input type="text" id="inKelas" placeholder="Contoh: X-1">
    <button class="btn btn-primary" id="mulaiBtn">Mulai Ujian</button>
    <div class="err" id="identErr"></div>
  </div>

  <div id="timer" style="display:none;"></div>
  <div id="banner"></div>
  <div id="soalPane" style="display:none;"></div>
  <div id="submitPane" style="display:none; text-align:center;">
    <button class="btn btn-primary" id="kumpulBtn" style="max-width:320px;">Kumpulkan Jawaban</button>
    <div class="err" id="submitErr"></div>
  </div>

  <div id="hasilBox" class="card" style="display:none;"></div>
</div>
<div id="peringatan"><div class="pbox"><div style="font-size:34px;">⚠️</div><h2>Peringatan!</h2><p id="pelMsg"></p><button class="btn btn-primary" id="pelBtn">Saya mengerti, lanjutkan ujian</button></div></div>
<script>
const CFG = {"testId":"murmqqaxadcpr","judul":"jkjj","durasiMenit":0,"acak":true,"maks":0,"endpoint":"https://script.google.com/macros/s/AKfycby3tzhn9zQRWJaQdfhkDn3kNk-18OgRnuvhJqr-KU_782OjqAJ4gcrPAZssFYilgLJx/exec","soal":[{"id":"murmp0htte9y2","tipe":"pg","teks":",kkdd","opsi":[{"key":"A","teks":",c"},{"key":"B","teks":"cd mmd"},{"key":"C","teks":",vv,rf"},{"key":"D","teks":"fv"},{"key":"E","teks":", ,ff ,v"}]},{"id":"murmpmhj9h4gm","tipe":"pg","teks":"jj","opsi":[{"key":"A","teks":"k"},{"key":"B","teks":"k.k"},{"key":"C","teks":"jj"},{"key":"D","teks":"m"},{"key":"E","teks":"n"}]}]};
let soalTampil = CFG.soal.slice();
if(CFG.acak){ for(let i=soalTampil.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [soalTampil[i],soalTampil[j]]=[soalTampil[j],soalTampil[i]]; } }
const jawaban = {};
let timerInterval = null;
let identitas = null;

document.getElementById("judulTes").textContent = CFG.judul || "Ujian Online";
document.getElementById("infoTes").textContent = (CFG.soal.length)+" soal" + (CFG.durasiMenit?(" • "+CFG.durasiMenit+" menit"):"");

document.getElementById("mulaiBtn").onclick = function(){
  const nama = document.getElementById("inNama").value.trim();
  const nis = document.getElementById("inNis").value.trim();
  const kelas = document.getElementById("inKelas").value.trim();
  if(!nama || !nis){ document.getElementById("identErr").textContent = "Nama dan NIS wajib diisi."; return; }
  identitas = { nama:nama, nis:nis, kelas:kelas };
  document.getElementById("identitasPane").style.display = "none";
  tampilkanSoal();
  mulaiPantau();
};

var soalById = {};
CFG.soal.forEach(function(x){ soalById[x.id] = x; });
function bodySoal(s){
  var t = s.tipe || "pg";
  if(t==="pg"){
    return s.opsi.map(function(o){
      return '<label class="opsi"><input type="radio" name="q_'+s.id+'" value="'+o.key+'"> <span><strong>'+o.key+'.</strong> '+escapeHtml(o.teks)+'</span></label>';
    }).join("");
  }
  if(t==="pgk"){
    return '<p class="hint">Pilih semua jawaban yang benar.</p>' + s.opsi.map(function(o){
      return '<label class="opsi"><input type="checkbox" name="q_'+s.id+'" value="'+o.key+'"> <span><strong>'+o.key+'.</strong> '+escapeHtml(o.teks)+'</span></label>';
    }).join("");
  }
  if(t==="bs"){
    return ["Benar","Salah"].map(function(v){
      return '<label class="opsi"><input type="radio" name="q_'+s.id+'" value="'+v+'"> <span>'+v+'</span></label>';
    }).join("");
  }
  if(t==="jodoh"){
    var opts = '<option value="">— pilih pasangan —</option>' + s.kanan.map(function(k){
      return '<option value="'+k.id+'">'+escapeHtml(k.teks)+'</option>';
    }).join("");
    return '<p class="hint">Pilih pasangan yang tepat untuk setiap pernyataan.</p>' + s.kiri.map(function(k){
      return '<div class="jrow"><div class="jk">'+escapeHtml(k.teks)+'</div><select data-k="'+k.id+'">'+opts+'</select></div>';
    }).join("");
  }
  if(t==="isian"){
    return '<input type="text" class="isian" placeholder="Tulis jawaban singkat" autocomplete="off">';
  }
  return '<textarea placeholder="Tulis jawaban Anda di sini"></textarea>';
}
function rekamJawaban(e){
  var el = e.target;
  var card = el.closest ? el.closest(".soal") : null;
  if(!card) return;
  var sid = card.getAttribute("data-sid");
  var s = soalById[sid]; if(!s) return;
  var t = s.tipe || "pg";
  if(t==="pg" || t==="bs"){ if(el.checked) jawaban[sid] = el.value; }
  else if(t==="pgk"){
    jawaban[sid] = Array.prototype.slice.call(card.querySelectorAll("input[type=checkbox]:checked")).map(function(c){ return c.value; });
  } else if(t==="jodoh"){
    var m = {};
    Array.prototype.slice.call(card.querySelectorAll("select")).forEach(function(sel){ if(sel.value) m[sel.getAttribute("data-k")] = sel.value; });
    jawaban[sid] = m;
  } else { jawaban[sid] = el.value; }
}
function tampilkanSoal(){
  const pane = document.getElementById("soalPane");
  pane.innerHTML = soalTampil.map(function(s,i){
    return '<div class="card soal" data-sid="'+s.id+'"><b>'+(i+1)+'. '+escapeHtml(s.teks).split(String.fromCharCode(10)).join("<br>")+'</b>' + bodySoal(s) + '</div>';
  }).join("");
  pane.style.display = "block";
  document.getElementById("submitPane").style.display = "block";
  pane.addEventListener("change", rekamJawaban);
  pane.addEventListener("input", rekamJawaban);
  if(CFG.durasiMenit > 0) mulaiTimer(CFG.durasiMenit*60);
}

var pelanggaran = 0, logPel = [], keluar = false, hbInterval = null, otomatis = false;

function kirimPantau(aksi){
  if(!CFG.endpoint || !identitas) return;
  var body = JSON.stringify({ action:aksi, testId:CFG.testId, nama:identitas.nama, nis:identitas.nis, kelas:identitas.kelas, pelanggaran:pelanggaran, log:logPel });
  try{
    fetch(CFG.endpoint, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:body, keepalive:true }).catch(function(){});
  }catch(e){}
}
function updateBanner(){
  var el = document.getElementById("banner");
  el.style.display = "block";
  if(pelanggaran > 0){
    el.className = "bad";
    el.textContent = "⚠ Terdeteksi keluar dari halaman ujian: " + pelanggaran + " kali" + (CFG.maks > 0 ? " (batas " + CFG.maks + " kali)" : "");
  } else {
    el.className = "";
    el.textContent = "Jangan berpindah tab atau membuka aplikasi lain selama ujian. Aktivitas keluar halaman dicatat dan dilaporkan ke guru.";
  }
}
function mulaiPantau(){
  updateBanner();
  kirimPantau("mulai");
  hbInterval = setInterval(function(){ if(!sudahKirim) kirimPantau("hb"); }, 10000);
}
function catat(alasan){
  if(!identitas || sudahKirim || keluar) return;
  keluar = true;
  pelanggaran++;
  logPel.push({ w:new Date().toISOString(), a:alasan });
  if(logPel.length > 50) logPel.shift();
  updateBanner();
  kirimPantau("hb");
  if(CFG.maks > 0 && pelanggaran >= CFG.maks){ otomatis = true; kumpulkan(); }
}
function kembali(){
  if(!keluar || document.visibilityState !== "visible") return;
  keluar = false;
  if(sudahKirim) return;
  document.getElementById("pelMsg").textContent = "Anda terdeteksi meninggalkan halaman ujian (" + pelanggaran + " kali). Aktivitas ini sudah dicatat dan dilaporkan kepada guru." + (CFG.maks > 0 ? " Ujian akan dikumpulkan otomatis setelah " + CFG.maks + " pelanggaran." : "");
  document.getElementById("peringatan").style.display = "flex";
}
document.getElementById("pelBtn").onclick = function(){ document.getElementById("peringatan").style.display = "none"; };
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden") catat("Berpindah tab / membuka aplikasi lain");
  else kembali();
});
window.addEventListener("blur", function(){
  setTimeout(function(){ if(!document.hasFocus()) catat("Meninggalkan jendela ujian"); }, 400);
});
window.addEventListener("focus", kembali);

function mulaiTimer(detik){
  const el = document.getElementById("timer");
  el.style.display = "block";
  let sisa = detik;
  function tick(){
    const m = Math.floor(sisa/60), s = sisa%60;
    el.textContent = "Sisa waktu: " + m + ":" + (s<10?"0":"")+s;
    if(sisa<=0){ clearInterval(timerInterval); kumpulkan(); return; }
    sisa--;
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

document.getElementById("kumpulBtn").onclick = kumpulkan;
let sudahKirim = false;
function kumpulkan(){
  if(sudahKirim) return; sudahKirim = true;
  if(timerInterval) clearInterval(timerInterval);
  if(hbInterval) clearInterval(hbInterval);
  document.getElementById("banner").style.display = "none";
  document.getElementById("peringatan").style.display = "none";
  document.getElementById("soalPane").style.display = "none";
  document.getElementById("submitPane").style.display = "none";
  document.getElementById("timer").style.display = "none";
  const payload = { action:"submit", testId:CFG.testId, nama:identitas.nama, nis:identitas.nis, kelas:identitas.kelas, jawaban:jawaban, pelanggaran:pelanggaran, log:logPel };
  if(!CFG.endpoint){ tampilkanGagal("Server belum dikonfigurasi oleh guru."); return; }
  fetch(CFG.endpoint, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok){ tampilkanSukses(res); }
      else{ tampilkanGagal((res && res.pesan) || "Gagal mengirim jawaban."); }
    })
    .catch(function(){ tampilkanGagal("Tidak dapat terhubung ke server. Periksa koneksi internet."); });
}
function tampilkanSukses(res){
  const box = document.getElementById("hasilBox");
  box.style.display = "block";
  var info = res.total ? '<div class="skor">'+res.skor+'</div><p class="muted">Benar '+res.benar+' dari '+res.total+' soal</p>' : '<p class="muted">Seluruh soal akan dinilai oleh guru.</p>';
  if(res.essay) info += '<p class="muted">'+res.essay+' soal essay dinilai manual oleh guru.</p>';
  if(pelanggaran>0) info += '<p class="err">Tercatat '+pelanggaran+' kali keluar dari halaman ujian dan dilaporkan ke guru.</p>';
  if(otomatis) info = '<p class="err">Ujian dikumpulkan otomatis karena batas pelanggaran terlampaui.</p>' + info;
  box.innerHTML = '<p>Jawaban berhasil dikirim.</p>' + info;
}
function tampilkanGagal(pesan){
  const box = document.getElementById("hasilBox");
  box.style.display = "block";
  box.innerHTML = '<p class="err">'+escapeHtml(pesan)+'</p><p class="muted">Jawaban Anda tersimpan di perangkat ini — hubungi guru untuk mengirim ulang, atau unduh cadangan di bawah.</p>' +
    '<button class="btn btn-primary" id="unduhCadanganBtn" style="max-width:280px;">⭳ Unduh Cadangan Jawaban</button>';
  document.getElementById("unduhCadanganBtn").onclick = function(){
    const data = { testId:CFG.testId, judul:CFG.judul, identitas:identitas, jawaban:jawaban, pelanggaran:pelanggaran, waktu:new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "cadangan-jawaban-"+(identitas.nis||"siswa")+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
}
</script>
</body>
</html>
